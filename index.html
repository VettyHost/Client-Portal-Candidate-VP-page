<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Profile - Mask Shipping Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts (Optional but nice) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom animation for modal */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Icon Components (Replaced lucide-react imports with inline SVGs for standalone HTML) ---
        
        const ChevronDown = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );

        const Download = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );

        const Truck = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 18H3c-.6 0-1-.4-1-1V9.4c0-.5.2-1 .6-1.4l1.9-2.3c.4-.4 1-.6 1.5-.6h2c.6 0 1.1.2 1.5.6L11.4 8c.4.4.6.9.6 1.4V17c0 .6-.4 1-1 1h-2"/><path d="M14 18H5"/><path d="M19 18h2c.6 0 1-.4 1-1v-4c0-.6-.4-1-1-1h-1"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
        );

        const User = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );

        const Car = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 16H9m10 4h3v-7a5 5 0 0 0-5-5H7a5 5 0 0 0-5 5v7h3m10 0v-4m-10 0v-4m3.5 1h7"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
        );

        const Box = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        );

        // --- Reusable Logic Components ---

        const StatusBadge = ({ status, date }) => {
            let colorClass = "";
            let text = status;

            if (status === "In Progress" || status === "Ordered") {
                colorClass = "bg-blue-600 text-white";
            } else if (status === "Review Needed") {
                colorClass = "bg-yellow-400 text-white";
            } else if (status === "Clear" || status === "Delivered") {
                colorClass = "bg-green-400 text-white";
            } else if (status === "Pending") {
                colorClass = "bg-gray-400 text-white";
            }

            return (
                <div className="flex flex-col items-end">
                    <span className={`px-3 py-1 text-xs font-bold rounded ${colorClass} uppercase tracking-wider`}>
                        {text}
                    </span>
                    {date && <span className="text-gray-400 text-xs mt-1">{date}</span>}
                </div>
            );
        };

        const Card = ({ title, icon: Icon, children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6 ${className}`}>
                <div className="flex items-center mb-6">
                    <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                        {title}
                        {Icon && <Icon className="w-5 h-5 text-gray-500" />}
                    </h2>
                </div>
                {children}
            </div>
        );

        const SectionRow = ({ title, status, date, isLast = false, onTrack }) => (
            <div className={`flex justify-between items-start py-4 ${!isLast ? 'border-b border-gray-100' : ''}`}>
                <div className="flex items-center gap-2">
                    <span className="text-gray-700 font-medium">{title}</span>
                    <ChevronDown className="w-4 h-4 text-gray-400 cursor-pointer hover:text-gray-600" />
                </div>
                <div className="flex items-center gap-4">
                    <StatusBadge status={status} date={date} />
                    {onTrack ? (
                        <button 
                            onClick={onTrack}
                            className="text-blue-500 hover:text-blue-700 text-sm font-semibold underline cursor-pointer"
                        >
                            Track
                        </button>
                    ) : (
                        <Download className="w-4 h-4 text-gray-300 cursor-pointer hover:text-gray-500" />
                    )}
                </div>
            </div>
        );

        const TimelineItem = ({ status, title, date, color, isLast }) => (
            <div className="relative pl-8 pb-8 last:pb-0">
                {/* Vertical Line */}
                {!isLast && (
                    <div className="absolute left-[11px] top-3 bottom-0 w-0.5 bg-gray-200"></div>
                )}
                
                {/* Dot */}
                <div className={`absolute left-0 top-1.5 w-6 h-6 rounded-full border-4 border-white shadow-sm flex items-center justify-center z-10 ${color}`}>
                </div>

                {/* Content */}
                <div className="flex flex-col">
                    <div className="flex justify-between items-start">
                        <span className="font-bold text-gray-800 text-sm">{status}</span>
                        <span className="text-gray-400 text-xs">{date}</span>
                    </div>
                    {title && <p className="text-gray-500 text-sm mt-1 leading-snug">{title}</p>}
                </div>
            </div>
        );

        // --- Main App Component ---

        function App() {
            const [showTrackModal, setShowTrackModal] = useState(false);

            // Mock Data for Order History
            const orderHistory = [
                {
                    status: "Delivered",
                    title: "The Vetty Team updated the status to Delivered on 03/26/2025",
                    date: "03/26/2025",
                    color: "bg-green-400", 
                    type: "success"
                },
                {
                    status: "Ordered",
                    title: "The Vetty Team placed an order. Status updated to Ordered on 03/25/2025",
                    date: "03/25/2025",
                    color: "bg-blue-500",
                    type: "info"
                }
            ];

            return (
                <div className="min-h-screen bg-gray-50 p-4 md:p-8 font-sans">
                    <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                        
                        {/* Left Sidebar: Actions & Activity Feed */}
                        <div className="lg:col-span-1 space-y-8">
                            {/* Quick Actions Placeholder */}
                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-semibold text-gray-500">Actions</h3>
                                    <span className="text-xs text-blue-500 cursor-pointer">More Actions...</span>
                                </div>
                                <div className="bg-gray-100 rounded-xl p-6 h-32 flex items-center justify-center text-center text-gray-500 text-sm border border-gray-200">
                                    Quick action for you to take will appear here. Currently everything is humming along smoothly.
                                </div>
                            </div>

                            {/* Activity Feed */}
                            <div>
                                <h3 className="font-semibold text-gray-500 mb-4">Activity Feed</h3>
                                <div className="relative">
                                    <TimelineItem 
                                        status="Criminal County Check Complete"
                                        title="Information Received"
                                        date="11/14/25"
                                        color="bg-purple-400"
                                    />
                                    <TimelineItem 
                                        status="Additional Individual Check Started"
                                        title="County Civil"
                                        date="11/14/25"
                                        color="bg-pink-500"
                                    />
                                    <TimelineItem 
                                        status="Background Screening Started"
                                        title="ssn nc"
                                        date="11/13/25"
                                        color="bg-blue-500"
                                    />
                                    <TimelineItem 
                                        status="Invitation Sent"
                                        title=""
                                        date="11/13/25"
                                        color="bg-gray-300"
                                        isLast={true}
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Right Content Area */}
                        <div className="lg:col-span-3 space-y-6">
                            <h1 className="text-2xl font-bold text-gray-400 mb-6">Verified Profile</h1>

                            {/* Card 1: Background Screening */}
                            <Card title="Background Screening" icon={User}>
                                <div className="mb-6">
                                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Identity</h3>
                                    <SectionRow title="Social Security Trace" status="In Progress" date="11/13/2025" />
                                </div>

                                <div className="mb-6">
                                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Basic Criminal</h3>
                                    <SectionRow title="Sanctions and Watchlist Search" status="In Progress" date="11/13/2025" />
                                    <SectionRow title="National Criminal Check" status="In Progress" date="11/13/2025" />
                                </div>

                                <div>
                                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Advanced Criminal</h3>
                                    <SectionRow title="County Criminal Check" status="Review Needed" date="11/14/2025" />
                                    <SectionRow title="State Criminal Check" status="In Progress" date="11/13/2025" />
                                    <SectionRow title="County Civil Check" status="Clear" date="11/14/2025" isLast={true} />
                                </div>
                            </Card>

                            {/* Card 2: Motor Vehicle Record */}
                            <Card title="Motor Vehicle Record" icon={Car}>
                                <SectionRow title="Current Driver's License" status="In Progress" date="11/13/2025" isLast={true} />
                            </Card>

                            {/* Card 3: Mask Shipping (New Feature) */}
                            <Card title="Mask Shipping" icon={Box} className="border-l-4 border-l-blue-500">
                                <div className="flex flex-col md:flex-row md:items-center justify-between py-2">
                                    <div>
                                        <h4 className="font-semibold text-gray-800 text-lg">HAYLARD REGULAR 46727</h4>
                                        <p className="text-gray-400 text-sm mt-1">Product Check Code</p>
                                    </div>
                                    
                                    <div className="mt-4 md:mt-0 flex items-center gap-6">
                                        {/* Status Badge */}
                                        <div className="text-right">
                                            <StatusBadge status="Delivered" date="03/26/2025" />
                                        </div>

                                        {/* Track Button */}
                                        <button 
                                            onClick={() => setShowTrackModal(true)}
                                            className="flex items-center gap-2 bg-blue-50 text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-lg font-medium transition-colors"
                                        >
                                            <Truck className="w-4 h-4" />
                                            Track
                                        </button>
                                    </div>
                                </div>
                            </Card>

                        </div>
                    </div>

                    {/* Tracking Modal */}
                    {showTrackModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-30 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden animate-fade-in-up">
                                {/* Modal Header */}
                                <div className="p-6 pb-2">
                                    <h2 className="text-2xl font-medium text-center text-gray-700">Order History</h2>
                                </div>

                                {/* Modal Body: The Timeline */}
                                <div className="p-6 pt-4">
                                    <div className="relative border-l-2 border-gray-100 ml-3 space-y-8 pl-8 py-2">
                                        {orderHistory.map((item, idx) => (
                                            <div key={idx} className="relative">
                                                {/* Circle Indicator */}
                                                <div className={`absolute -left-[39px] top-0 w-5 h-5 rounded-full border-2 bg-white flex items-center justify-center
                                                    ${item.type === 'success' ? 'border-green-400' : 'border-blue-500'}`}
                                                >
                                                </div>

                                                {/* Content */}
                                                <div>
                                                    <h4 className={`font-medium text-sm mb-1 ${item.type === 'success' ? 'text-green-500' : 'text-blue-500'}`}>
                                                        {item.status}
                                                    </h4>
                                                    <p className="text-gray-700 text-sm leading-relaxed">
                                                        {item.title.split(item.status).map((part, i, arr) => (
                                                            <React.Fragment key={i}>
                                                                {part}
                                                                {i < arr.length - 1 && <span className="font-bold">{item.status}</span>}
                                                            </React.Fragment>
                                                        ))}
                                                    </p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Modal Footer */}
                                <div className="p-6 pt-0 flex justify-center">
                                    <button 
                                        onClick={() => setShowTrackModal(false)}
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-10 rounded-lg shadow-md transition-transform transform active:scale-95"
                                    >
                                        Ok
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
